name: Sync missing demos van boumax.nl

on:
  schedule:
    # 10:00 Europe/Amsterdam in de zomer (UTC+2) = 08:00 UTC, 09:00 in de
    # winter (UTC+1). Verplaatst op 20-08-2026 van 06:20 UTC naar 08:00 UTC:
    # de dagelijkse cloud-pipeline start om 06:00 UTC en kan (mail checken +
    # opvolging + demo bouwen/deployen) meer dan 20 minuten duren. Bij 06:20
    # kon deze Action een net teruggezette demo-map alweer laten
    # overschrijven door een stap-3-deploy die met een oudere kloon werkte.
    # Twee uur buffer is ruim voldoende voor deze achtergrondtaak; de
    # pipeline doet zelf ook een git pull --ff-only vlak voor het bouwen van
    # een nieuwe demo, dus de veiligheid hangt niet alleen van deze
    # tijdsbuffer af.
    - cron: "0 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync ontbrekende demo-mappen vanaf Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: python3 scripts/sync_missing_demos.py

      - name: Commit en push als er iets veranderd is
        run: |
          git config user.name "boumax-sync-bot"
          git config user.email "actions@github.com"
          git add deploy/
          if git diff --cached --quiet; then
            echo "Niets te committen."
          else
            git commit -m "Sync: ontbrekende demo's toegevoegd vanaf boumax.nl"
            git push
          fi
